<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Travel Concierge</title>
<!-- Optional: used only to draw A2UI Icon components. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0d9488;
    --accent-hover: #0f766e;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text-color: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --header-bg: #0d9488;
    --header-text: #ffffff;
    --chip-bg: #ffffff;
    --chip-text: #334155;
    --chip-hover-bg: #0d9488;
    --chip-hover-text: #ffffff;
    --input-bg: #ffffff;
    --shadow: rgba(0, 0, 0, 0.04);
  }

  [data-theme="dark"] {
    --accent: #14b8a6;
    --accent-hover: #2dd4bf;
    --bg: #0f172a;
    --card-bg: #1e293b;
    --text-color: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #334155;
    --header-bg: #115e59;
    --header-text: #ffffff;
    --chip-bg: #1e293b;
    --chip-text: #cbd5e1;
    --chip-hover-bg: #14b8a6;
    --chip-hover-text: #0f172a;
    --input-bg: #1e293b;
    --shadow: rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; transition: background .2s ease, color .2s ease; }
  
  header { background: var(--header-bg); color: var(--header-text); padding: .9rem 1.4rem; font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .header-brand { display: flex; align-items: center; gap: .6rem; }
  .header-actions { display: flex; gap: .5rem; align-items: center; }
  .header-btn { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 16px; padding: .35rem .75rem; font-size: .85rem; font-weight: 500; cursor: pointer; transition: all .15s ease; backdrop-filter: blur(4px); }
  .header-btn:hover { background: rgba(255,255,255,.3); }

  #log { flex: 1; overflow-y: auto; padding: 1.2rem; max-width: 800px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: .8rem; }
  
  /* --- Dialogue layout styles --- */
  .msg { display: flex; gap: .7rem; margin: .3rem 0; align-items: flex-start; width: 100%; }
  .msg.user { flex-direction: row-reverse; }
  .avatar { width: 36px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; flex-shrink: 0; background: #ccfbf1; color: var(--accent); border: 1px solid #99f6e4; box-shadow: 0 1px 2px var(--shadow); }
  [data-theme="dark"] .avatar { background: #134e4a; border-color: #115e59; color: #5eead4; }
  .msg.user .avatar { background: var(--accent); color: #fff; border: none; }
  .msg-content { max-width: 82%; display: flex; flex-direction: column; gap: .25rem; }
  .msg-sender { font-size: .75rem; font-weight: 600; color: var(--text-muted); margin-left: .2rem; }
  .msg.user .msg-sender { text-align: right; margin-right: .2rem; margin-left: 0; }
  
  .bubble { display: inline-block; padding: .75rem 1rem; border-radius: 16px; background: var(--card-bg); border: 1px solid var(--border); text-align: left; line-height: 1.5; color: var(--text-color); font-size: .95rem; white-space: pre-wrap; box-shadow: 0 1px 3px var(--shadow); }
  .msg.agent .bubble { border-top-left-radius: 4px; }
  .msg.user .bubble { background: var(--accent); color: #fff; border: none; border-top-right-radius: 4px; box-shadow: 0 2px 6px rgba(13,148,136,.2); }
  .bubble.rich { background: transparent; border: none; padding: 0; max-width: 100%; white-space: normal; box-shadow: none; }

  /* --- Typing Indicator --- */
  .typing-dots { display: inline-flex; gap: 4px; align-items: center; padding: .4rem .6rem; }
  .typing-dots span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 1.4s infinite ease-in-out both; }
  .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
  .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes pulse { 0%, 80%, 100% { transform: scale(0); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }

  /* --- Dynamic Follow-up Chips --- */
  .followup-chips { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .4rem; margin-left: .2rem; }
  .followup-chip { background: var(--chip-bg); border: 1px solid var(--border); border-radius: 14px; padding: .3rem .65rem; font-size: .8rem; color: var(--accent); cursor: pointer; transition: all .15s ease; font-weight: 500; }
  .followup-chip:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  form { display: flex; gap: .6rem; padding: 1rem 1.2rem; border-top: 1px solid var(--border); background: var(--card-bg); box-shadow: 0 -2px 10px var(--shadow); max-width: 800px; width: 100%; margin: 0 auto; }
  input { flex: 1; padding: .75rem 1.1rem; border: 1px solid var(--border); border-radius: 24px; font-size: .95rem; outline: none; background: var(--input-bg); color: var(--text-color); transition: all .15s ease; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,.15); }
  button.send-btn { padding: .75rem 1.4rem; border: none; border-radius: 24px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; transition: background .15s ease; }
  button.send-btn:hover { background: var(--accent-hover); }

  /* --- A2UI component styles --- */
  .a2card { border: 1px solid var(--border); border-radius: 16px; padding: 1.1rem; background: var(--card-bg); box-shadow: 0 2px 8px var(--shadow); max-width: 100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top: .6rem; }
  .a2col { display: flex; flex-direction: column; gap: .4rem; }
  .a2row { display: flex; flex-direction: row; gap: .6rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; }
  .a2text.a2-h1 { font-size: 1.5rem; font-weight: 700; color: var(--text-color); }
  .a2text.a2-h2 { font-size: 1.25rem; font-weight: 700; color: var(--text-color); }
  .a2text.a2-h3 { font-size: 1.1rem; font-weight: 600; color: var(--text-color); }
  .a2text.a2-h4 { font-size: 1rem; font-weight: 600; color: var(--text-color); }
  .a2text.a2-caption { font-size: .85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: .5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; box-shadow: 0 2px 6px var(--shadow); cursor: zoom-in; transition: transform .15s ease; }
  .a2img:hover { transform: scale(1.015); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
  .examples { display: flex; gap: .5rem; padding: .6rem 1rem 0; max-width: 800px; margin: 0 auto; width: 100%; flex-wrap: wrap; justify-content: center; }
  .chip { background: var(--chip-bg); border: 1px solid var(--border); border-radius: 18px; padding: .45rem .9rem; font-size: .85rem; color: var(--chip-text); cursor: pointer; transition: all .15s ease; font-weight: 500; box-shadow: 0 1px 3px var(--shadow); }
  .chip:hover { background: var(--chip-hover-bg); color: var(--chip-hover-text); border-color: var(--accent); transform: translateY(-1px); }

  /* --- Lightbox Modal --- */
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; cursor: zoom-out; }
  #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.5); object-fit: contain; }
</style>
</head>
<body>
<header>
  <div class="header-brand">✈️ Smart Travel Concierge</div>
  <div class="header-actions">
    <button type="button" class="header-btn" onclick="toggleDarkMode()" id="dark-toggle">🌙 Dark</button>
    <button type="button" class="header-btn" onclick="clearChat()">🗑️ New Chat</button>
  </div>
</header>
<div id="log"></div>
<div class="examples">
  <button type="button" class="chip" onclick="sendExample('Suggest 3 places to visit in Kyoto')">⛩️ Explore Kyoto</button>
  <button type="button" class="chip" onclick="sendExample('Convert 150 USD to JPY and check Tokyo weather')">💴 Currency & Weather</button>
  <button type="button" class="chip" onclick="sendExample('Recommend a 3-day itinerary for Tokyo under $500')">🗓️ 3-Day Tokyo Itinerary</button>
</div>
<form id="form">
  <input id="input" placeholder="Ask about destinations, weather, itineraries..." autocomplete="off" autofocus>
  <button class="send-btn">Send</button>
</form>

<div id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="Enlarged view">
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
let activeSessionId = "session-" + Math.random().toString(36).substring(2, 9);

function toggleDarkMode() {
  const isDark = document.body.getAttribute("data-theme") === "dark";
  document.body.setAttribute("data-theme", isDark ? "light" : "dark");
  document.getElementById("dark-toggle").textContent = isDark ? "🌙 Dark" : "☀️ Light";
  localStorage.setItem("theme", isDark ? "light" : "dark");
}

// Restore saved theme preference
if (localStorage.getItem("theme") === "dark") {
  document.body.setAttribute("data-theme", "dark");
  document.getElementById("dark-toggle").textContent = "☀️ Light";
}

function clearChat() {
  log.innerHTML = "";
  activeSessionId = "session-" + Math.random().toString(36).substring(2, 9);
}

function openLightbox(src) {
  const lb = document.getElementById("lightbox");
  const img = document.getElementById("lightbox-img");
  img.src = src;
  lb.style.display = "flex";
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

function sendExample(txt) {
  input.value = txt;
  form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const av = el("div", "avatar", who === "user" ? "👤" : "✈️");
  const cnt = el("div", "msg-content");
  const sender = el("div", "msg-sender", who === "user" ? "You" : "Smart Travel Concierge");
  const b = el("div", "bubble");
  
  cnt.appendChild(sender);
  cnt.appendChild(b);
  
  if (who === "user") {
    m.appendChild(cnt);
    m.appendChild(av);
  } else {
    m.appendChild(av);
    m.appendChild(cnt);
  }
  
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return { bubble: b, content: cnt };
}

function showTypingIndicator() {
  const m = el("div", "msg agent", null);
  m.id = "active-typing";
  const av = el("div", "avatar", "✈️");
  const cnt = el("div", "msg-content");
  const sender = el("div", "msg-sender", "Smart Travel Concierge");
  const b = el("div", "bubble");
  
  const dots = el("div", "typing-dots");
  dots.appendChild(el("span")); dots.appendChild(el("span")); dots.appendChild(el("span"));
  const label = el("span", null, " Smart Travel Concierge is thinking...");
  label.style.fontSize = ".85rem"; label.style.color = "var(--text-muted)";
  b.appendChild(dots); b.appendChild(label);
  
  cnt.appendChild(sender); cnt.appendChild(b);
  m.appendChild(av); m.appendChild(cnt);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
}

function hideTypingIndicator() {
  const t = document.getElementById("active-typing");
  if (t) t.remove();
}

function addFollowupChips(container, queryText) {
  const chipsDiv = el("div", "followup-chips");
  const suggestions = [
    { text: "☀️ Check Weather", prompt: "What is the current weather there?" },
    { text: "📷 Generate Photo", prompt: "Generate a beautiful preview photo for this location" },
    { text: "📍 Nearby Attractions", prompt: "What are the top recommended nearby attractions?" }
  ];
  for (const s of suggestions) {
    const chip = el("button", "followup-chip", s.text);
    chip.type = "button";
    chip.onclick = () => sendExample(s.prompt);
    chipsDiv.appendChild(chip);
  }
  container.appendChild(chipsDiv);
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || "";
      img.onclick = () => openLightbox(src);
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, contentDiv, parts, queryText) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  
  addFollowupChips(contentDiv, queryText);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  
  bubble("user").bubble.textContent = text;
  input.value = "";
  
  showTypingIndicator();
  
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: activeSessionId })
    });
    const raw = await res.text();
    hideTypingIndicator();
    
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    
    const { bubble: b, content: cnt } = bubble("agent");
    renderReply(b, cnt, data.parts || [], text);
  } catch (e) {
    hideTypingIndicator();
    const { bubble: b } = bubble("agent");
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
